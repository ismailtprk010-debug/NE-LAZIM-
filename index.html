    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;

            --text-muted: #94a3b8;
            --accent: #3b82f6;

        [data-theme="light"] {

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); transition: 0.3s; padding-bottom: 50px; }

        header {

            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        .logo span { color: var(--text-main); }

        .theme-btn {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-container {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .nav-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .nav-tab.active, .nav-tab:hover {
            background: var(--accent);
            color: #fff;
        }

        .container { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .panel-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--accent); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }

        input, select {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            outline: none;
        }

        select {

            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
            padding-right: 2.2rem;
        }

        .action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .action-btn:hover { background: var(--accent-hover); }

        .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .summary-banner {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .score-board { display: flex; justify-content: space-around; align-items: center; margin-top: 0.75rem; }
        .score-num { font-size: 2rem; font-weight: 800; color: var(--accent); }
        .vs-badge { background: var(--accent); color: #fff; padding: 0.3rem 0.6rem; border-radius: 99px; font-size: 0.8rem; font-weight: 800; }
        
        .compare-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        .compare-table th, .compare-table td { padding: 0.85rem; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .compare-table th { background: rgba(59, 130, 246, 0.08); }
        .spec-label { font-weight: 600; color: var(--text-muted); width: 28%; background: rgba(0,0,0,0.02); }
        .winner { background: var(--win-bg); color: var(--win-text); font-weight: 700; }
        .win-badge { display: inline-block; background: var(--win-border); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }

        .result-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .item-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; }
        .item-card h4 { margin-bottom: 0.3rem; color: var(--accent); font-size: 0.95rem; }
