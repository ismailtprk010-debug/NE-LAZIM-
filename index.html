
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NE LAZIM?</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#10131c;color:white}
header{text-align:center;padding:35px 15px;background:#171d2b}
h1{font-size:38px;color:#00d9ff;margin:0}
header p{color:#ddd}
main{max-width:900px;margin:auto;padding:20px}
.card{background:#1c2435;padding:20px;border-radius:15px;margin:15px 0}
h2{color:#00d9ff}
input,select{width:100%;padding:13px;margin:8px 0;border:0;border-radius:8px;font-size:16px}
button{background:#00bfe8;color:#07111a;padding:13px;border:0;border-radius:8px;font-weight:bold;width:100%;font-size:16px}
.result{color:#00e6a0;font-size:20px;margin-top:12px}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>

<header>
<h1>NE LAZIM?</h1>
<p>Aradığın her şey bir tık uzağında!</p>
</header>

<main>

<div class="card">
<h2>Yüzde Hesaplama</h2>
<input id="sayi" type="number" placeholder="Sayı">
<input id="yuzde" type="number" placeholder="Yüzde">
<button onclick="yuzdeHesapla()">Hesapla</button>
<div class="result" id="sonuc"></div>
</div>

<div class="card">
<h2>İndirim Hesaplama</h2>
<input id="fiyat" type="number" placeholder="Ürün fiyatı (TL)">
<input id="indirim" type="number" placeholder="İndirim oranı (%)">
<button onclick="indirimHesapla()">Hesapla</button>
<div class="result" id="indirimSonuc"></div>
</div>

<div class="card">
<h2>Bütçene Uygun Telefon Bul</h2>
<input id="telefonButce" type="number" placeholder="Bütçen (TL)">
<button onclick="telefonBul()">Telefon Öner</button>
<div class="result" id="telefonSonuc"></div>
</div>

<div class="card">
<h2>Bütçene Uygun Araba Bul</h2>
<input id="arabaButce" type="number" placeholder="Bütçen (TL)">
<button onclick="arabaBul()">Araba Öner</button>
<div class="result" id="arabaSonuc"></div>
</div>

<div class="card">
<h2>Telefon Karşılaştırma</h2>
<input id="telefon1" placeholder="Birinci telefon">
<input id="telefon2" placeholder="İkinci telefon">
<button onclick="karsilastir()">Karşılaştır</button>
<div class="result" id="karsilastirmaSonuc"></div>
</div>

</main>

<footer>NE LAZIM? © 2026</footer>

<script>
function yuzdeHesapla(){
let a=Number(document.getElementById('sayi').value);
let b=Number(document.getElementById('yuzde').value);
document.getElementById('sonuc').innerText=
a*(b/100)+"";
}
function indirimHesapla(){
let a=Number(document.getElementById('fiyat').value);
let b=Number(document.getElementById('indirim').value);
document.getElementById('indirimSonuc').innerText=
"İndirimli fiyat: "+(a-a*b/100)+" TL";
}
function telefonBul(){
let b=Number(document.getElementById('telefonButce').value);
let t=b<5000?"İkinci el giriş seviyesi telefonlara bakabilirsin.":
b<10000?"Redmi Note ve Samsung Galaxy A serilerini inceleyebilirsin.":
"Redmi Note Pro ve Samsung Galaxy A serilerini inceleyebilirsin.";
document.getElementById('telefonSonuc').innerText=t;
}
function arabaBul(){
let b=Number(document.getElementById('arabaButce').value);
let t=b<300000?"Bütçene uygun araç bulmak zor olabilir.":
b<600000?"Eski model Fiat, Renault ve Tofaş ilanlarını inceleyebilirsin.":
"Renault, Fiat, Opel ve Hyundai ilanlarını inceleyebilirsin.";
document.getElementById('arabaSonuc').innerText=t;
}


function sayiBul(deger, desen) {
  const eslesme = String(deger || "").match(desen);
  return eslesme ? Number(eslesme[1]) : null;
}

function degerBul(telefon, alan, desen) {
  return sayiBul(telefon[alan], desen);
}

function karsilastir() {
  const t1 = telefonlar.find(t => t.model === secim1.value);
  const t2 = telefonlar.find(t => t.model === secim2.value);

  if (!t1 || !t2) {
    sonuc.innerHTML = "<p>İki telefon da seçmelisin.</p>";
    return;
  }

  if (t1.model === t2.model) {
    sonuc.innerHTML = "<p>İki farklı telefon seçmelisin.</p>";
    return;
  }

  const kategoriler = [
    {
      ad: "RAM",
      a: degerBul(t1, "ram", /(\d+)\s*GB/i),
      b: degerBul(t2, "ram", /(\d+)\s*GB/i)
    },
    {
      ad: "Kamera",
      a: t1.kamera ? [...t1.kamera.matchAll(/(\d+)\s*MP/gi)]
        .reduce((s, x) => s + Number(x[1]), 0) : null,
      b: t2.kamera ? [...t2.kamera.matchAll(/(\d+)\s*MP/gi)]
        .reduce((s, x) => s + Number(x[1]), 0) : null
    },
    {
      ad: "Ekran yenileme hızı",
      a: degerBul(t1, "ekran", /(\d+)\s*Hz/i),
      b: degerBul(t2, "ekran", /(\d+)\s*Hz/i)
    },
    {
      ad: "Batarya",
      a: degerBul(t1, "batarya", /(\d+)\s*mAh/i),
      b: degerBul(t2, "batarya", /(\d+)\s*mAh/i)
    },
    {
      ad: "Depolama",
      a: degerBul(t1, "depolama", /(\d+)\s*GB/i),
      b: degerBul(t2, "depolama", /(\d+)\s*GB/i)
    }
  ];

  let puan1 = 0;
  let puan2 = 0;
  let karsilastirilan = 0;
  let detay = "";

  kategoriler.forEach(k => {
    if (k.a === null || k.b === null) {
      detay += `<tr><td>${k.ad}</td><td colspan="2">Yeterli veri yok</td></tr>`;
      return;
    }

    karsilastirilan++;

    let sonucMetni = "Berabere";
    if (k.a > k.b) {
      puan1++;
      sonucMetni = t1.model + " önde";
    } else if (k.b > k.a) {
      puan2++;
      sonucMetni = t2.model + " önde";
    }

    detay += `<tr><td>${k.ad}</td><td>${k.a}</td><td>${k.b}</td></tr>`;
  });

  const toplam = puan1 + puan2;
  const skor1 = toplam ? Math.round(puan1 / toplam * 100) : 0;
  const skor2 = toplam ? 100 - skor1 : 0;

  let kazanan = "Berabere";
  let aciklama = "Karşılaştırılabilen özelliklerde eşit sonuç çıktı.";

  if (puan1 > puan2) {
    kazanan = t1.model;
    aciklama = "Karşılaştırılabilen özelliklerde daha fazla kategoride önde.";
  } else if (puan2 > puan1) {
    kazanan = t2.model;
    aciklama = "Karşılaştırılabilen özelliklerde daha fazla kategoride önde.";
  }

  sonuc.innerHTML = `
    <h3>🏆 Sistem değerlendirmesi</h3>
    <h2>${kazanan}</h2>
    <p>${aciklama}</p>

    <div style="display:flex;gap:15px;flex-wrap:wrap">
      <div><b>${t1.model}</b><h2>${skor1}/100</h2></div>
      <div><b>${t2.model}</b><h2>${skor2}/100</h2></div>
    </div>

    <p>Değerlendirilen kategori: ${karsilastirilan}/5</p>

    <h3>Özellik karşılaştırması</h3>
    <table>
      <tr><th>Özellik</th><th>${t1.model}</th><th>${t2.model}</th></tr>
      ${detay}
    </table>

    <p style="font-size:12px;color:#aaa">
      Puanlar yalnızca karşılaştırılabilir sayısal özelliklere göre hesaplanır.
      Kamera megapiksel toplamı tek başına fotoğraf kalitesini göstermez.
      İşlemci performansı ve gerçek kamera kalitesi bu puana dahil değildir.
      Eksik bilgiler tahmin edilmez.
    </p>
  `;
}



    

</script>
</body>
</html>
initial
