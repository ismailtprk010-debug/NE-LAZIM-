            --muted: #64748b; --accent: #2563eb; --border: #e2e8f0;

        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        .logo span { color: var(--text); }
        .theme-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .nav { background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 6px; padding: 0.5rem 1rem; overflow-x: auto; }
        .nav-tab { background: transparent; border: none; color: var(--muted); padding: 8px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 6px; white-space: nowrap; }
        .nav-tab.active, .nav-tab:hover { background: var(--accent); color: #fff; }
        .container { max-width: 980px; margin: 1.2rem auto; padding: 0 1rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; margin-bottom: 1rem; }
        .panel-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.7rem; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .badge-count { background: rgba(59,130,246,0.15); color: var(--accent); padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; }
        input, select { width: 100%; padding: 0.65rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.85rem; margin-bottom: 0.5rem; outline: none; }
        .btn { background: var(--accent); color: #fff; border: none; padding: 0.65rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-gold { background: var(--gold); color: #0f172a; font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.8rem; }
        .summary { background: var(--card); border: 1px solid var(--accent); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; text-align: center; }
        .scores { display: flex; justify-content: space-around; align-items: center; margin-top: 0.5rem; }
        .score-val { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        th, td { padding: 0.75rem; text-align: center; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        th { background: rgba(59, 130, 246, 0.08); }
        .spec { font-weight: 600; color: var(--muted); width: 26%; }
        .winner { background: var(--win-bg); color: var(--win-text); font-weight: 700; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.8rem; margin-top: 0.8rem; }
        .card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem; }
        .card h4 { color: var(--accent); font-size: 0.9rem; margin-bottom: 0.25rem; }
        .card p { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
        .gold-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.8rem; }
        .gold-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; border-top: 3px solid var(--gold); }
        .gold-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.6rem; color: var(--text); }
        .gold-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 0.3rem; }
        .gold-buy { color: var(--muted); }
        .gold-sell { font-weight: 800; color: var(--gold); }
        .edit-box { border-top: 1px solid var(--border); margin-top: 1rem; padding-top: 1rem; display: none; }
        @media(max-width: 650px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>

<header>
    <div class="logo">Ne<span>Lazım?</span></div>

</header>

<div class="nav">
    <button class="nav-tab active" onclick="openTab('compare', this)">📱 Telefon Karşılaştır</button>

    <button class="nav-tab" onclick="openTab('bCar', this)">🚗 Bütçe Araba</button>

    <button class="nav-tab" onclick="openTab('calc', this)">🧮 Hesaplama</button>
</div>

<div class="container">
    <!-- 1. TELEFON KARŞILAŞTIR -->
    <div id="tab-compare" class="tab-content active">
        <div class="grid-2">
            <div class="panel">
                <div class="panel-title">1. Telefon <span class="badge-count" id="c1-count"></span></div>
                <input type="text" id="q1" placeholder="Marka veya model ara..." oninput="filterSel(1)">
                <select id="s1" onchange="runCompare()"></select>
            </div>
            <div class="panel">
                <div class="panel-title">2. Telefon <span class="badge-count" id="c2-count"></span></div>
                <input type="text" id="q2" placeholder="Marka veya model ara..." oninput="filterSel(2)">
                <select id="s2" onchange="runCompare()"></select>
            </div>
        </div>
        <div class="summary" id="sum-box"></div>
        <table>
            <thead><tr><th class="spec">Özellik</th><th id="th1">1. Telefon</th><th id="th2">2. Telefon</th></tr></thead>
            <tbody id="cmp-body"></tbody>
        </table>
    </div>

    <!-- 2. BÜTÇE TELEFON -->
    <div id="tab-bPhone" class="tab-content">
        <div class="panel">
            <div class="panel-title">Bütçeye Göre Telefon Bul <span class="badge-count" id="bp-count"></span></div>
            <div class="grid-3">
                <input type="number" id="bp-max" value="60000" placeholder="Maksimum Bütçe (TL)">
                <input type="text" id="bp-brand" placeholder="Marka filtrele (örn: Apple, Samsung)...">
                <button class="btn" onclick="runBudgetPhone()">Modelleri Listele</button>
            </div>
        </div>
        <div class="cards" id="bp-list"></div>
    </div>

    <!-- 3. BÜTÇE ARABA -->
    <div id="tab-bCar" class="tab-content">
        <div class="panel">
            <div class="panel-title">Bütçeye Göre Araba Bul <span class="badge-count" id="bc-count"></span></div>
            <div class="grid-3">
                <input type="number" id="bc-max" value="2000000" placeholder="Maksimum Bütçe (TL)">
                <input type="text" id="bc-brand" placeholder="Marka/model ara (örn: Fiat, BMW, TOGG)...">
                <button class="btn" onclick="runBudgetCar()">Araçları Listele</button>
            </div>
        </div>
        <div class="cards" id="bc-list"></div>
    </div>

    <!-- 4. ALTIN FİYATLARI -->
    <div id="tab-gold" class="tab-content">
        <div class="panel">
            <div class="panel-title">
                <span>Güncel Altın Alış / Satış Fiyatları</span>
                <button class="theme-btn" onclick="toggleGoldEdit()">✏️ Fiyatları Düzenle</button>
            </div>
            <div class="gold-grid" id="gold-list"></div>

            <!-- Hızlı Altın Güncelleme Paneli -->
            <div class="edit-box" id="gold-edit-panel">
                <p style="font-size:0.8rem; color:var(--muted); margin-bottom:0.8rem;">Güncel fiyatları girip kaydettiğinizde tarayıcınızda saklanır:</p>
                <div id="gold-inputs" class="grid-2"></div>
                <div class="grid-2" style="margin-top:0.5rem;">
                    <button class="btn btn-gold" onclick="saveGoldPrices()">💾 Fiyatları Kaydet</button>
                    <button class="theme-btn" style="width:100%; padding:0.65rem;" onclick="resetGoldPrices()">Varsayılana Dön</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. HESAPLAMA -->
    <div id="tab-calc" class="tab-content">
        <div class="panel">
            <div class="panel-title">İndirim Hesaplayıcı</div>
            <div class="grid-3">
                <input type="number" id="d-price" value="10000" placeholder="Fiyat (TL)">
                <input type="number" id="d-rate" value="25" placeholder="İndirim (%)">
                <button class="btn" onclick="doDiscount()">Hesapla</button>
            </div>
            <p id="d-res" style="margin-top:0.6rem; color:var(--win-text); font-weight:700; font-size:0.9rem;"></p>
        </div>
    </div>
</div>

const phones = rawPhones.map(p => ({
    brand: p[0], name: p[1], price: p[2], cpu: p[3], cpuScore: p[4],
    ram: p[5], storage: p[6], hz: p[7], battery: p[8], charge: p[9],
    cam: p[10], camScore: p[11]
}));

const cars = rawCars.map(c => ({
    brand: c[0], model: c[1], price: c[2], year: c[3], fuel: c[4], body: c[5]
}));

function renderGold() {
    document.getElementById("gold-list").innerHTML = goldData.map(g => `
        <div class="gold-card">
            <div class="gold-name">${g.name}</div>
            <div class="gold-row"><span class="gold-buy">Alış:</span><strong>${g.buy}</strong></div>
            <div class="gold-row"><span class="gold-buy">Satış:</span><span class="gold-sell">${g.sell}</span></div>
        </div>
    `).join("");

    document.getElementById("gold-inputs").innerHTML = goldData.map((g, idx) => `
        <div style="background:var(--bg); padding:0.6rem; border-radius:6px; border:1px solid var(--border);">
            <div style="font-size:0.8rem; font-weight:700; margin-bottom:0.4rem;">${g.name}</div>
            <div class="grid-2">
                <input type="text" id="gb-${idx}" value="${g.buy}" placeholder="Alış">
                <input type="text" id="gs-${idx}" value="${g.sell}" placeholder="Satış">
            </div>
        </div>
    `).join("");
}

function toggleGoldEdit() {
    const p = document.getElementById("gold-edit-panel");
    p.style.display = p.style.display === "block" ? "none" : "block";
}

function saveGoldPrices() {
    goldData = goldData.map((g, idx) => ({
        name: g.name,
        buy: document.getElementById(`gb-${idx}`).value || g.buy,
        sell: document.getElementById(`gs-${idx}`).value || g.sell
    }));
    localStorage.setItem("nelazim_gold", JSON.stringify(goldData));
    renderGold();
    toggleGoldEdit();
}

function resetGoldPrices() {
    localStorage.removeItem("nelazim_gold");
    goldData = JSON.parse(JSON.stringify(defaultGold));
    renderGold();
}

function init() {
    renderGold();
    filterSel(1);
    filterSel(2);
    document.getElementById("s1").value = "iPhone 16 Pro Max";
    document.getElementById("s2").value = "Galaxy S25 Ultra";
    runCompare();
    runBudgetPhone();
    runBudgetCar();
}

function openTab(id, btn) {
    document.querySelectorAll(".tab-content").forEach(e => e.classList.remove("active"));
    document.querySelectorAll(".nav-tab").forEach(e => e.classList.remove("active"));
    document.getElementById("tab-" + id).classList.add("active");
    btn.classList.add("active");
}

function filterSel(num) {
    const q = document.getElementById("q" + num).value.toLowerCase();
    const sel = document.getElementById("s" + num);
    const prev = sel.value;
    const list = phones.filter(p => (p.brand + " " + p.name).toLowerCase().includes(q));
    document.getElementById("c" + num + "-count").textContent = list.length + " model";
    sel.innerHTML = "";
    list.forEach(p => sel.add(new Option(`${p.brand} ${p.name} (${p.price.toLocaleString()} TL)`, p.name)));
    if (list.some(p => p.name === prev)) sel.value = prev;
    runCompare();
}

function runCompare() {
    const p1 = phones.find(p => p.name === document.getElementById("s1").value);
    const p2 = phones.find(p => p.name === document.getElementById("s2").value);
    if (!p1 || !p2) return;

    document.getElementById("th1").textContent = `${p1.brand} ${p1.name}`;
    document.getElementById("th2").textContent = `${p2.brand} ${p2.name}`;

    let sc1 = 0, sc2 = 0;
    const rows = [
        ["Fiyat", `${p1.price.toLocaleString()} TL`, `${p2.price.toLocaleString()} TL`, p1.price < p2.price ? 1 : (p2.price < p1.price ? 2 : 0)],
        ["İşlemci", p1.cpu, p2.cpu, p1.cpuScore > p2.cpuScore ? 1 : (p2.cpuScore > p1.cpuScore ? 2 : 0)],
        ["RAM / Hafıza", `${p1.ram}GB / ${p1.storage}GB`, `${p2.ram}GB / ${p2.storage}GB`, p1.ram > p2.ram ? 1 : (p2.ram > p1.ram ? 2 : 0)],
        ["Ekran Hızı", `${p1.hz} Hz`, `${p2.hz} Hz`, p1.hz > p2.hz ? 1 : (p2.hz > p1.hz ? 2 : 0)],
        ["Batarya / Şarj", `${p1.battery}mAh (${p1.charge}W)`, `${p2.battery}mAh (${p2.charge}W)`, p1.battery > p2.battery ? 1 : (p2.battery > p1.battery ? 2 : 0)],
        ["Kamera", p1.cam, p2.cam, p1.camScore > p2.camScore ? 1 : (p2.camScore > p1.camScore ? 2 : 0)]
    ];

    document.getElementById("cmp-body").innerHTML = rows.map(r => {
        if (r[3] === 1) sc1++;
        if (r[3] === 2) sc2++;
        return `<tr>
            <td class="spec">${r[0]}</td>
            <td class="${r[3]===1?'winner':''}">${r[1]}</td>
            <td class="${r[3]===2?'winner':''}">${r[2]}</td>
        </tr>`;
    }).join("");

    const winText = sc1 > sc2 ? `${p1.brand} ${p1.name}` : (sc2 > sc1 ? `${p2.brand} ${p2.name}` : "Berabere");
    document.getElementById("sum-box").innerHTML = `
        <div>🏆 Karşılaştırma Galibi: <strong>${winText}</strong></div>
        <div class="scores">
            <div><small>${p1.name}</small><div class="score-val">${sc1}</div></div>
            <div style="font-weight:800; color:var(--accent)">VS</div>
            <div><small>${p2.name}</small><div class="score-val">${sc2}</div></div>
        </div>
    `;
}

function runBudgetPhone() {
    const max = parseFloat(document.getElementById("bp-max").value) || 9999999;
    const b = document.getElementById("bp-brand").value.toLowerCase();
    const list = phones.filter(p => p.price <= max && (p.brand + " " + p.name).toLowerCase().includes(b))
                       .sort((a, b) => b.price - a.price);
    document.getElementById("bp-count").textContent = list.length + " sonuç";
    document.getElementById("bp-list").innerHTML = list.length ? list.map(p => `
        <div class="card">
            <h4>${p.brand} ${p.name}</h4>
            <p><strong>${p.price.toLocaleString()} TL</strong></p>
            <p>${p.cpu} • ${p.ram}GB RAM • ${p.storage}GB</p>
            <p>${p.battery} mAh (${p.charge}W) • ${p.cam}</p>
        </div>
    `).join("") : "<p>Bu kriterlere uygun telefon bulunamadı.</p>";
}

function runBudgetCar() {
    const max = parseFloat(document.getElementById("bc-max").value) || 99999999;
    const b = document.getElementById("bc-brand").value.toLowerCase();
    const list = cars.filter(c => c.price <= max && (c.brand + " " + c.model + " " + c.body + " " + c.fuel).toLowerCase().includes(b))
                     .sort((a, b) => b.price - a.price);
    document.getElementById("bc-count").textContent = list.length + " sonuç";
    document.getElementById("bc-list").innerHTML = list.length ? list.map(c => `
        <div class="card">
            <h4>${c.brand} ${c.model}</h4>
            <p><strong>${c.price.toLocaleString()} TL</strong></p>
            <p>${c.year} Model • ${c.fuel} • ${c.body}</p>
        </div>
    `).join("") : "<p>Bu kriterlere uygun araba bulunamadı.</p>";
}

function doDiscount() {
    const p = parseFloat(document.getElementById("d-price").value) || 0;
    const r = parseFloat(document.getElementById("d-rate").value) || 0;
    const save = p * (r / 100);
    document.getElementById("d-res").textContent = `İndirimli Fiyat: ${(p - save).toLocaleString()} TL (Kazanç: ${save.toLocaleString()} TL)`;
}

init();
</script>
