<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ne Lazım? - Akıllı Karşılaştırma ve Hesaplama Portalı</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --win-bg: rgba(34, 197, 94, 0.15);
            --win-text: #4ade80;
            --win-border: #22c55e;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #cbd5e1;
            --win-bg: rgba(22, 163, 74, 0.12);
            --win-text: #16a34a;
            --win-border: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); transition: 0.3s; padding-bottom: 50px; }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.6rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        .logo span { color: var(--text-main); }

        .theme-btn {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Navigasyon Sekmeleri */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .nav-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .nav-tab.active, .nav-tab:hover {
            background: var(--accent);
            color: #fff;
        }

        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Ortak Kart ve Form Stilleri */
        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .panel-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--accent); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        
        input, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover { background: var(--accent-hover); }

        /* Karşılaştırma Modülü Stilleri */
        .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        .summary-banner {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .score-board { display: flex; justify-content: space-around; align-items: center; margin-top: 1rem; }
        .score-num { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
        .vs-badge { background: var(--accent); color: #fff; padding: 0.4rem 0.8rem; border-radius: 99px; font-weight: 800; }
        
        .compare-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); }
        .compare-table th, .compare-table td { padding: 1rem; text-align: center; border-bottom: 1px solid var(--border-color); }
        .compare-table th { background: rgba(59, 130, 246, 0.1); }
        .spec-label { font-weight: 600; color: var(--text-muted); width: 24%; background: rgba(0,0,0,0.05); }
        .winner { background: var(--win-bg); color: var(--win-text); font-weight: 700; }
        .win-badge { display: inline-block; background: var(--win-border); color: #fff; font-size: 0.7rem; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }

        /* Sonuç Listeleri */
        .result-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .item-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem; }
        .item-card h4 { margin-bottom: 0.4rem; color: var(--accent); }

        @media (max-width: 768px) {
            .selector-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Ne<span>Lazım?</span></div>
    <button class="theme-btn" onclick="toggleTheme()">Tema Değiştir</button>
</header>

<div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('compare')">📱 Telefon Karşılaştır</button>
    <button class="nav-tab" onclick="switchTab('budgetPhone')">💵 Bütçeye Göre Telefon</button>
    <button class="nav-tab" onclick="switchTab('budgetCar')">🚗 Bütçeye Göre Araç İlanı</button>
    <button class="nav-tab" onclick="switchTab('calc')">🧮 Hesaplama Araçları</button>
</div>

<div class="container">

    <!-- SEKME 1: TELEFON KARŞILAŞTIRMA -->
    <div id="tab-compare" class="tab-content active">
        <div class="selector-grid">
            <div class="panel-card" style="margin-bottom:0;">
                <div class="panel-title">1. Telefon Seçimi</div>
                <select id="select-1" onchange="comparePhones()"></select>
            </div>
            <div class="panel-card" style="margin-bottom:0;">
                <div class="panel-title">2. Telefon Seçimi</div>
                <select id="select-2" onchange="comparePhones()"></select>
            </div>
        </div>

        <div class="summary-banner" id="summary-box"></div>

        <table class="compare-table">
            <thead>
                <tr>
                    <th class="spec-label">Özellik</th>
                    <th id="th-p1">1. Telefon</th>
                    <th id="th-p2">2. Telefon</th>
                </tr>
            </thead>
            <tbody id="compare-body"></tbody>
        </table>
    </div>

    <!-- SEKME 2: BÜTÇEYE GÖRE TELEFON -->
    <div id="tab-budgetPhone" class="tab-content">
        <div class="panel-card">
            <div class="panel-title">Bütçenize Uygun Telefonları Bulun</div>
            <div class="form-grid">
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Maksimum Bütçe (TL)</label>
                    <input type="number" id="max-phone-budget" value="35000" placeholder="Örn: 30000">
                </div>
                <div style="display:flex; align-items:flex-end;">
                    <button class="action-btn" onclick="filterPhonesByBudget()">Modelleri Listele</button>
                </div>
            </div>
        </div>
        <div class="result-list" id="phone-budget-results"></div>
    </div>

    <!-- SEKME 3: BÜTÇEYE GÖRE ARAÇ İLANLARI -->
    <div id="tab-budgetCar" class="tab-content">
        <div class="panel-card">
            <div class="panel-title">Bütçeye Göre Araç İlanları Simülatörü</div>
            <div class="form-grid">
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Maksimum Araç Bütçesi (TL)</label>
                    <input type="number" id="max-car-budget" value="750000" placeholder="Örn: 750000">
                </div>
                <div style="display:flex; align-items:flex-end;">
                    <button class="action-btn" onclick="filterCarsByBudget()">İlanları Göster</button>
                </div>
            </div>
        </div>
        <div class="result-list" id="car-budget-results"></div>
    </div>

    <!-- SEKME 4: HESAPLAMA ARAÇLARI (İndirim & Yüzde) -->
    <div id="tab-calc" class="tab-content">
        <div class="panel-card">
            <div class="panel-title">🏷️ İndirim ve Kampanya Hesaplayıcı</div>
            <div class="form-grid">
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Orijinal Fiyat (TL)</label>
                    <input type="number" id="orig-price" value="1000">
                </div>
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">İndirim Oranı (%)</label>
                    <input type="number" id="discount-rate" value="25">
                </div>
                <div style="display:flex; align-items:flex-end;">
                    <button class="action-btn" onclick="calcDiscount()">İndirimi Hesapla</button>
                </div>
            </div>
            <div id="discount-result" style="margin-top:1rem; font-weight:600; color:var(--win-text);"></div>
        </div>

        <div class="panel-card">
            <div class="panel-title">📊 Yüzde Hesaplayıcı (Bir Sayının Yüzdesi)</div>
            <div class="form-grid">
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Ana Sayı</label>
                    <input type="number" id="calc-base" value="4500">
                </div>
                <div>
                    <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:4px;">Yüzde Değeri (%)</label>
                    <input type="number" id="calc-percent" value="15">
                </div>
                <div style="display:flex; align-items:flex-end;">
                    <button class="action-btn" onclick="calcPercentage()">Yüzdesini Al</button>
                </div>
            </div>
            <div id="percent-result" style="margin-top:1rem; font-weight:600; color:var(--win-text);"></div>
        </div>
    </div>

</div>

<script>
// Örnek Veritabanları (Telefonlar, Araçlar, Fiyatlar)
const phonesDatabase = [
    { name: "iPhone 16 Pro Max", price: 95000, cpu: "Apple A18 Pro", cpuScore: 99, ram: 8, storage: 256, screen: "6.9\" OLED 120Hz", hz: 120, battery: 4685, charge: 45, camera: "48MP Pro", camScore: 98, weight: 227 },
    { name: "Galaxy S25 Ultra", price: 85000, cpu: "Snapdragon 8 Elite", cpuScore: 100, ram: 12, storage: 256, screen: "6.9\" AMOLED 120Hz", hz: 120, battery: 5000, charge: 45, camera: "200MP", camScore: 99, weight: 218 },
    { name: "POCO X6 Pro", price: 24000, cpu: "Dimensity 8300-Ultra", cpuScore: 88, ram: 12, storage: 512, screen: "6.67\" AMOLED 120Hz", hz: 120, battery: 5000, charge: 67, camera: "64MP OIS", camScore: 79, weight: 186 },
    { name: "Samsung Galaxy A55", price: 21000, cpu: "Exynos 1480", cpuScore: 76, ram: 8, storage: 128, screen: "6.6\" AMOLED 120Hz", hz: 120, battery: 5000, charge: 25, camera: "50MP OIS", camScore: 81, weight: 213 },
    { name: "Redmi Note 13 Pro", price: 18500, cpu: "Helio G99-Ultra", cpuScore: 63, ram: 8, storage: 256, screen: "6.67\" AMOLED 120Hz", hz: 120, battery: 5000, charge: 67, camera: "200MP OIS", camScore: 79, weight: 188 },
    { name: "Honor 200", price: 27000, cpu: "Snapdragon 7 Gen 3", cpuScore: 81, ram: 12, storage: 256, screen: "6.7\" OLED 120Hz", hz: 120, battery: 5200, charge: 100, camera: "50MP OIS", camScore: 86, weight: 187 }
];

const carsDatabase = [
    { title: "Renault Clio 1.0 TCe Joy", price: 720000, year: 2022, km: "45.000 km", fuel: "Benzin" },
    { title: "Fiat Egea 1.4 Fire Easy", price: 620000, year: 2023, km: "30.000 km", fuel: "Benzin" },
    { title: "Hyundai i20 1.4 MPI Style", price: 780000, year: 2023, km: "20.000 km", fuel: "Benzin" },
    { title: "Volkswagen Polo 1.0 TSI Life", price: 890000, year: 2022, km: "50.000 km", fuel: "Benzin" },
    { title: "Toyota Corolla 1.5 Vision", price: 950000, year: 2022, km: "60.000 km", fuel: "Benzin" }
];

function init() {
    const s1 = document.getElementById("select-1");
    const s2 = document.getElementById("select-2");
    
    phonesDatabase.forEach((p, index) => {
        s1.add(new Option(p.name, p.name));
        s2.add(new Option(p.name, p.name));
    });

    s1.selectedIndex = 0;
    s2.selectedIndex = 1 > phonesDatabase.length ? 0 : 1;
    comparePhones();
    filterPhonesByBudget();
    filterCarsByBudget();
}

function switchTab(tabId) {
    document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(".nav-tab").forEach(el => el.classList.remove("active"));
    
    document.getElementById("tab-" + tabId).classList.add("active");
    event.currentTarget.classList.add("active");
}

function comparePhones() {
    const p1 = phonesDatabase.find(p => p.name === document.getElementById("select-1").value);
    const p2 = phonesDatabase.find(p => p.name === document.getElementById("select-2").value);
    if (!p1 || !p2) return;

    document.getElementById("th-p1").textContent = p1.name;
    document.getElementById("th-p2").textContent = p2.name;

    let score1 = 0, score2 = 0;
    const rows = [
        { label: "Ortalama Fiyat", v1: `${p1.price.toLocaleString()} TL`, v2: `${p2.price.toLocaleString()} TL`, win: p1.price < p2.price ? 1 : (p2.price < p1.price ? 2 : 0) },
        { label: "İşlemci", v1: p1.cpu, v2: p2.cpu, win: p1.cpuScore > p2.cpuScore ? 1 : (p2.cpuScore > p1.cpuScore ? 2 : 0) },
        { label: "RAM / Hafıza", v1: `${p1.ram} GB / ${p1.storage}GB`, v2: `${p2.ram} GB / ${p2.storage}GB`, win: p1.ram > p2.ram ? 1 : (p2.ram > p1.ram ? 2 : 0) },
        { label: "Batarya / Şarj", v1: `${p1.battery} mAh (${p1.charge}W)`, v2: `${p2.battery} mAh (${p2.charge}W)`, win: p1.battery > p2.battery ? 1 : (p2.battery > p1.battery ? 2 : 0) },
        { label: "Kamera Puanı", v1: p1.camera, v2: p2.camera, win: p1.camScore > p2.camScore ? 1 : (p2.camScore > p1.camScore ? 2 : 0) }
    ];

    const tbody = document.getElementById("compare-body");
    tbody.innerHTML = "";

    rows.forEach(r => {
        if (r.win === 1) score1++;
        if (r.win === 2) score2++;
        const badge = `<span class="win-badge">Daha İyi</span>`;
        tbody.innerHTML += `
            <tr>
                <td class="spec-label">${r.label}</td>
                <td class="${r.win === 1 ? 'winner' : ''}">${r.v1} ${r.win === 1 ? badge : ''}</td>
                <td class="${r.win === 2 ? 'winner' : ''}">${r.v2} ${r.win === 2 ? badge : ''}</td>
            </tr>
        `;
    });

    let verdict = `🏆 Genel Karşılaştırma Kazananı: <strong>${score1 > score2 ? p1.name : (score2 > score1 ? p2.name : "Dengeli")}</strong>`;
    document.getElementById("summary-box").innerHTML = `
        <div>${verdict}</div>
        <div class="score-board">
            <div><h2>${p1.name}</h2><div class="score-num">${score1}</div></div>
            <div class="vs-badge">VS</div>
            <div><h2>${p2.name}</h2><div class="score-num">${score2}</div></div>
        </div>
    `;
}

function filterPhonesByBudget() {
    const max = parseFloat(document.getElementById("max-phone-budget").value) || 999999;
    const filtered = phonesDatabase.filter(p => p.price <= max);
    const container = document.getElementById("phone-budget-results");
    
    container.innerHTML = filtered.length ? filtered.map(p => `
        <div class="item-card">
            <h4>${p.name}</h4>
            <p style="color:var(--text-muted); font-size:0.9rem;">Fiyat: <strong>${p.price.toLocaleString()} TL</strong></p>
            <p style="font-size:0.85rem; margin-top:4px;">${p.ram}GB RAM - ${p.storage}GB Hafıza</p>
        </div>
    `).join('') : '<p style="color:var(--text-muted);">Bu bütçeye uygun telefon bulunamadı.</p>';
}

function filterCarsByBudget() {
    const max = parseFloat(document.getElementById("max-car-budget").value) || 9999999;
    const filtered = carsDatabase.filter(c => c.price <= max);
    const container = document.getElementById("car-budget-results");

    container.innerHTML = filtered.length ? filtered.map(c => `
        <div class="item-card">
            <h4>${c.title}</h4>
            <p style="color:var(--text-muted); font-size:0.9rem;">Fiyat: <strong>${c.price.toLocaleString()} TL</strong></p>
            <p style="font-size:0.85rem; margin-top:4px;">Yıl: ${c.year} | ${c.km} | ${c.fuel}</p>
        </div>
    `).join('') : '<p style="color:var(--text-muted);">Bu bütçeye uygun araç ilanı bulunamadı.</p>';
}

function calcDiscount() {
    const p = parseFloat(document.getElementById("orig-price").value) || 0;
    const d = parseFloat(document.getElementById("discount-rate").value) || 0;
    const saved = p * (d / 100);
    const final = p - saved;
    document.getElementById("discount-result").textContent = `İndirimli Tutar: ${final.toLocaleString()} TL (Tasarrufunuz: ${saved.toLocaleString()} TL)`;
}

function calcPercentage() {
    const base = parseFloat(document.getElementById("calc-base").value) || 0;
    const pct = parseFloat(document.getElementById("calc-percent").value) || 0;
    const res = base * (pct / 100);
    document.getElementById("percent-result").textContent = `${base} sayısının %${pct} kadarı: ${res.toLocaleString()} eder.`;
}

function toggleTheme() {
    const body = document.body;
    body.setAttribute("data-theme", body.getAttribute("data-theme") === "light" ? "dark" : "light");
}

init();
</script>
</body>
</html>


</body>
</html>
</script>
</body>
</html>
